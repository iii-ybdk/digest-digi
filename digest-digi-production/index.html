<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3e9"><title>Digest Digi</title><style>
:root{--paper:#f7f3e9;--card:#fffdf8;--ink:#171715;--muted:#716d65;--line:#dfd8c9;--purple:#6b5be2;--purpleSoft:#eeeaff;--green:#267657;--greenSoft:#e6f3ec;--amber:#8a611c;--amberSoft:#fff0d2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:1.3rem;letter-spacing:-.05em}.brand b{color:var(--purple)}.status{font-size:.8rem;color:var(--muted);display:flex;gap:7px;align-items:center}.status i{width:8px;height:8px;border-radius:50%;background:#d09a3f}.status.live i{background:#34a66f}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;margin:38px 0 22px}.eyebrow{text-transform:uppercase;letter-spacing:.09em;color:var(--purple);font-size:.74rem;font-weight:900}.hero h1{font:700 clamp(2.8rem,8vw,5.9rem)/.92 Georgia,serif;letter-spacing:-.06em;margin:8px 0}.hero p{color:var(--muted);margin:0;font-size:1.05rem}.quick{border:0;background:var(--ink);color:#fff;padding:12px 15px;border-radius:13px;font-weight:850;cursor:pointer}.quick.on{background:var(--purple)}nav{position:sticky;top:10px;z-index:5;display:flex;gap:6px;background:rgba(255,253,248,.86);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:20px}nav button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font-weight:850;color:var(--muted);cursor:pointer}nav .active{background:var(--ink);color:#fff}.view{display:none}.view.active{display:block}.super{background:var(--ink);color:white;border-radius:22px;padding:19px 21px;margin-bottom:24px}.super .eyebrow{color:#c8c2ff}.super h2{font:700 1.7rem Georgia,serif;margin:6px 0 10px}.super li{margin:7px 0;line-height:1.45}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:28px 0 12px}.sectionHead h2{font:700 1.8rem Georgia,serif;margin:4px 0 0}.sectionHead span{color:var(--muted);font-size:.84rem}.top3{display:grid;grid-template-columns:1.25fr .75fr .75fr;gap:12px}.storyCard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.art{height:150px;background:linear-gradient(135deg,#27213c,#6b5be2 55%,#d8cffd);display:flex;align-items:end;padding:10px;color:#eeeaff;font-size:.68rem;font-weight:900;letter-spacing:.08em}.art.alt1{background:linear-gradient(135deg,#191a28,#425189,#d0ba72)}.art.alt2{background:linear-gradient(135deg,#dad4c9,#9a93ac,#5d5577)}.art img{width:100%;height:100%;object-fit:cover;margin:-10px;min-width:calc(100% + 20px);min-height:calc(100% + 20px)}.storyBody{padding:16px}.rank{font-size:.73rem;color:var(--purple);font-weight:900}.storyCard h3{font:700 1.25rem/1.1 Georgia,serif;margin:6px 0 8px}.storyCard p{color:#565149;line-height:1.5;font-size:.91rem}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip,.badge{font-size:.69rem;font-weight:850;border-radius:999px;padding:6px 8px}.chip{background:#f0ece3;color:#665f55}.good{background:var(--greenSoft);color:var(--green)}.skip{background:var(--amberSoft);color:var(--amber)}details summary{cursor:pointer}.take{color:var(--purple)!important;font-weight:750}.sources{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sourceBox,.accordion{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.sourceBox summary,.accordion>summary{display:flex;justify-content:space-between;gap:10px;font-weight:900}.sourceBox summary span{color:var(--muted);font-size:.8rem}.mini{padding:12px 0;border-bottom:1px dashed var(--line)}.mini:last-child{border-bottom:0}.mini h3{font:700 1rem Georgia,serif;margin:7px 0 4px}.mini p{margin:0;color:var(--muted);line-height:1.45;font-size:.87rem}.accBody{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.noise{background:#fff8e8}.filters{display:grid;grid-template-columns:1fr 160px 160px 160px;gap:8px;margin-bottom:14px}.filters input,.filters select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font:inherit}.readLink{display:inline-flex;align-items:center;gap:5px;margin-top:12px;color:var(--purple);font-weight:850;text-decoration:none;font-size:.84rem}.readLink:hover{text-decoration:underline}.recapList{display:grid;gap:16px}.recapMonth{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.recapMonth>summary{padding:18px 20px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:900}.recapMonth>summary::-webkit-details-marker{display:none}.recapMonth>summary .monthTitle{font:700 1.35rem Georgia,serif}.recapMonth>summary .monthMeta{font-size:.8rem;color:var(--muted)}.recapInner{padding:0 20px 20px}.recapHero{background:var(--ink);color:white;border-radius:18px;padding:18px;margin-bottom:12px}.recapHero .eyebrow{color:#c8c2ff}.recapHero h3{font:700 1.6rem Georgia,serif;margin:6px 0 8px}.recapHero p{margin:0;color:#e7e3db;line-height:1.55}.recapSources{display:grid;grid-template-columns:1fr 1fr;gap:12px}.recapSource{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.recapSource h3{font:700 1.2rem Georgia,serif;margin:5px 0 8px}.recapSource p{color:var(--muted);line-height:1.5;margin:0}.recapCallout{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:16px}.recapCallout.watch{background:var(--purpleSoft)}.recapCallout.noise{background:var(--amberSoft)}.recapCallout h3{font:700 1.08rem Georgia,serif;margin:4px 0 7px}.recapCallout p{margin:0;color:#58534a;line-height:1.5}.readingList{margin-top:12px}.readingList a{display:block;padding:9px 0;border-bottom:1px dashed var(--line);color:var(--purple);text-decoration:none;font-weight:750}.readingList a:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:34px}@media(max-width:760px){.hero{grid-template-columns:1fr}.quick{justify-self:start}.top3{grid-template-columns:1fr 1fr}.top3 .storyCard:first-child{grid-column:1/-1}.sources,.recapSources{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid,.accBody{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:15px 12px 72px}.top3{grid-template-columns:1fr}.top3 .storyCard:first-child{grid-column:auto}.sectionHead{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">DIGEST <b>DIGI</b></div><div class="status" id="status"><i></i><span>Loading data…</span></div></header>
<section class="hero"><div><div class="eyebrow">Your personal brief</div><h1>Digi did the reading.</h1><p>Start with what matters. Expand the rest only when you want it.</p></div><button class="quick" id="quick">⚡ 60-second mode</button></section>
<nav><button class="active" data-tab="today">Today</button><button data-tab="explore">Explore</button><button data-tab="recaps">Recaps</button></nav>
<section id="today" class="view active"><div id="todayContent"></div></section>
<section id="explore" class="view"><div class="sectionHead"><div><div class="eyebrow">Explore</div><h2>Search everything Digi has read</h2></div><span id="resultCount"></span></div><div class="filters"><input id="search" placeholder="Search OpenAI, Nintendo, space…"><select id="month"><option value="all">All dates</option></select><select id="source"><option value="all">All newsletters</option></select><select id="verdict"><option value="all">All verdicts</option><option value="worth">Worth attention</option><option value="skip">Skippable</option></select></div><div class="grid" id="results"></div></section>
<section id="recaps" class="view"><div class="sectionHead"><div><div class="eyebrow">Monthly recaps</div><h2>The bigger picture</h2></div></div><div class="recapList" id="recapGrid"></div></section>
<footer>Digest Digi · Skim less. Know more.</footer></main>
<script>
let items=[], quick=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const worth=v=>String(v||'').toLowerCase().startsWith('worth');
const safeUrl=u=>{try{const x=new URL(String(u||''));return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}};
const monthLabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-1,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})};
function badge(v){return `<span class="badge ${worth(v)?'good':'skip'}">${esc(v||'Unrated')}</span>`}
function readLink(i){const u=safeUrl(i.article_url);return u?`<a class="readLink" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Further reading ↗</a>`:''}
function card(i,rank,idx=0){const tags=String(i.tags||'').split(',').filter(Boolean).slice(0,3).map(t=>`<span class="chip">${esc(t.trim())}</span>`).join('');const art=i.image_url?`<div class="art"><img src="${esc(i.image_url)}" alt=""></div>`:`<div class="art ${idx%3===1?'alt1':idx%3===2?'alt2':''}">${esc(sourceName(i.source))}</div>`;return `<article class="storyCard">${art}<div class="storyBody">${rank?`<div class="rank">#${rank}${rank===1?' · THE BIG ONE':''}</div>`:''}<h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p><div class="chips">${badge(i.verdict)}${tags}</div>${i.actionable_takeaway?`<details><summary>Digi's take</summary><p class="take">${esc(i.actionable_takeaway)}</p></details>`:''}${readLink(i)}</div></article>`}
function sourceName(s){if(/^tldr$/i.test(String(s||''))||/tldr/i.test(String(s||'')))return 'TLDR';if(/futurist/i.test(String(s||'')))return 'The Futurist';return s||'Digest Digi'}
function dailyItems(){return items.filter(i=>i.period!=='Monthly Recap')}
function renderToday(){const all=dailyItems().sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!all.length){document.getElementById('todayContent').innerHTML='<div class="empty">No daily digests yet. Monthly recaps live under Recaps.</div>';return}const latestDate=all[0].date;const sorted=all.filter(i=>i.date===latestDate);const top=sorted.filter(i=>worth(i.verdict)).slice(0,3);const brief=top.map(i=>i.title);const groups={};sorted.forEach(i=>{const n=sourceName(i.source);(groups[n]??=[]).push(i)});const sourceHtml=Object.entries(groups).map(([s,list])=>`<details class="sourceBox" open><summary><strong>${esc(s)}</strong><span>${list.length} items</span></summary>${list.map(i=>`<div class="mini">${badge(i.verdict)}<h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p>${readLink(i)}</div>`).join('')}</details>`).join('');const morning=sorted.filter(i=>i.period==='Morning');const evening=sorted.filter(i=>i.period==='Evening');const skipped=sorted.filter(i=>!worth(i.verdict));document.getElementById('todayContent').innerHTML=`<section class="super"><div class="eyebrow">Digi in 30 seconds · ${esc(latestDate)}</div><h2>Everything, ultra-brief</h2><ul>${brief.length?brief.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>No high-signal stories yet.</li>'}</ul></section><section><div class="sectionHead"><div><div class="eyebrow">Latest personal brief</div><h2>The 3 things worth knowing</h2></div><span>Ranked by Digi</span></div><div class="top3">${top.length?top.map((x,i)=>card(x,i+1,i)).join(''):'<div class="empty">Nothing made the Top 3 yet.</div>'}</div></section>${quick?'':`<section><div class="sectionHead"><div><div class="eyebrow">By newsletter</div><h2>What each one was saying</h2></div><span>Publication-level skim</span></div><div class="sources">${sourceHtml||'<div class="empty">No source summaries yet.</div>'}</div></section><section><div class="sectionHead"><h2>The full brief</h2><span>Collapsible</span></div><details class="accordion" open><summary>☀️ Morning Brief</summary><div class="accBody">${morning.length?morning.map((i,n)=>card(i,0,n)).join(''):'<div class="empty">No morning stories yet.</div>'}</div></details><details class="accordion"><summary>🌙 Evening Brief</summary><div class="accBody">${evening.length?evening.map((i,n)=>card(i,0,n)).join(''):'<div class="empty">No evening stories yet.</div>'}</div></details><details class="accordion noise"><summary>🗑️ Probably skip</summary><div class="accBody">${skipped.length?skipped.map((i,n)=>card(i,0,n)).join(''):'<div class="empty">Nothing in the bin 🎉</div>'}</div></details></section>`}`}
function setupFilters(){const months=[...new Set(items.map(i=>String(i.date).slice(0,7)).filter(Boolean))].sort().reverse();document.getElementById('month').innerHTML='<option value="all">All dates</option>'+months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('');const sources=[...new Set(items.map(i=>sourceName(i.source)).filter(Boolean))].sort();document.getElementById('source').innerHTML='<option value="all">All newsletters</option>'+sources.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');['search','month','source','verdict'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',renderExplore));renderExplore()}
function renderExplore(){const q=document.getElementById('search').value.toLowerCase(),m=document.getElementById('month').value,s=document.getElementById('source').value,v=document.getElementById('verdict').value;const out=[...items].sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(i=>(m==='all'||String(i.date).startsWith(m))&&(s==='all'||sourceName(i.source)===s)&&(v==='all'||(v==='worth'?worth(i.verdict):!worth(i.verdict)))&&(!q||(`${i.title} ${i.summary} ${i.tags} ${i.source}`).toLowerCase().includes(q)));document.getElementById('resultCount').textContent=`${out.length} results`;document.getElementById('results').innerHTML=out.length?out.map((i,n)=>card(i,0,n)).join(''):'<div class="empty">No matching digests.</div>'}
function recapSection(list,matcher){return list.find(matcher)}
function renderRecaps(){const rec=items.filter(i=>i.period==='Monthly Recap').sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!rec.length){document.getElementById('recapGrid').innerHTML='<div class="empty">Monthly recaps will appear here.</div>';return}const months={};rec.forEach(i=>{const m=String(i.date).slice(0,7);(months[m]??=[]).push(i)});const monthKeys=Object.keys(months).sort().reverse();const daily=dailyItems();document.getElementById('recapGrid').innerHTML=monthKeys.map((m,idx)=>{const list=months[m];const overview=recapSection(list,i=>/in 30 seconds/i.test(i.title))||list.find(i=>sourceName(i.source)==='Digest Digi'&&worth(i.verdict))||list[0];const tldr=recapSection(list,i=>sourceName(i.source)==='TLDR');const fut=recapSection(list,i=>sourceName(i.source)==='The Futurist');const watch=recapSection(list,i=>/watch/i.test(i.title));const noise=recapSection(list,i=>/noise|skip/i.test(i.title)||!worth(i.verdict));const other=list.filter(i=>![overview,tldr,fut,watch,noise].includes(i));const reads=daily.filter(i=>String(i.date).startsWith(m)&&worth(i.verdict)&&safeUrl(i.article_url)).slice(0,6);const sourceBox=i=>i?`<article class="recapSource"><div class="eyebrow">${esc(sourceName(i.source))}</div><h3>${esc(i.title.replace(/^TLDR\s*[—-]\s*/i,'').replace(/^The Futurist\s*[—-]\s*/i,''))}</h3><p>${esc(i.summary)}</p>${i.actionable_takeaway?`<p class="take">${esc(i.actionable_takeaway)}</p>`:''}</article>`:'';return `<details class="recapMonth" ${idx===0?'open':''}><summary><div><div class="monthTitle">${monthLabel(m)}</div><div class="monthMeta">${list.length} recap sections</div></div><span>⌄</span></summary><div class="recapInner">${overview?`<section class="recapHero"><div class="eyebrow">Digi in 30 seconds</div><h3>${esc(overview.title)}</h3><p>${esc(overview.summary)}</p>${overview.actionable_takeaway?`<p class="take">${esc(overview.actionable_takeaway)}</p>`:''}</section>`:''}<div class="recapSources">${sourceBox(tldr)}${sourceBox(fut)}</div>${watch?`<section class="recapCallout watch"><div class="eyebrow">Worth watching next</div><h3>${esc(watch.title)}</h3><p>${esc(watch.summary)}</p>${watch.actionable_takeaway?`<p class="take">${esc(watch.actionable_takeaway)}</p>`:''}</section>`:''}${other.length?`<details class="recapCallout"><summary><strong>Other signals · ${other.length}</strong></summary><div class="readingList">${other.map(i=>`<div class="mini">${badge(i.verdict)}<h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p></div>`).join('')}</div></details>`:''}${noise?`<details class="recapCallout noise"><summary><strong>🗑️ Mostly noise</strong></summary><h3>${esc(noise.title)}</h3><p>${esc(noise.summary)}</p></details>`:''}${reads.length?`<details class="recapCallout"><summary><strong>Further reading · ${reads.length}</strong></summary><div class="readingList">${reads.map(i=>`<a href="${esc(safeUrl(i.article_url))}" target="_blank" rel="noopener noreferrer">${esc(i.title)} ↗</a>`).join('')}</div></details>`:''}</div></details>`}).join('')}
function setTab(tab,persist=true){const valid=['today','explore','recaps'];if(!valid.includes(tab))tab='today';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===tab));if(persist){localStorage.setItem('digestDigiTab',tab);history.replaceState(null,'','#'+tab)}}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>setTab(location.hash.replace('#','')||'today',false));
document.getElementById('quick').addEventListener('click',e=>{quick=!quick;e.currentTarget.classList.toggle('on',quick);e.currentTarget.textContent=quick?'✓ 60-second mode':'⚡ 60-second mode';renderToday()});
const initialTab=(location.hash||'').replace('#','')||localStorage.getItem('digestDigiTab')||'today';setTab(initialTab,false);
fetch('/api/digests',{cache:'no-store'}).then(r=>r.json()).then(d=>{items=d.items||[];const s=document.getElementById('status');s.classList.toggle('live',!!d.live);s.querySelector('span').textContent=d.live?'Live data':(d.error?'Connection issue':'Preview data');renderToday();setupFilters();renderRecaps()}).catch(()=>{document.getElementById('status').querySelector('span').textContent='Data unavailable';renderToday();setupFilters();renderRecaps()});
</script></body></html>
