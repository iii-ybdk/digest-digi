<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3e9"><title>Digest Digi</title><style>
:root{--paper:#f7f3e9;--card:#fffdf8;--ink:#171715;--muted:#716d65;--line:#dfd8c9;--purple:#6b5be2;--purpleSoft:#eeeaff;--green:#267657;--greenSoft:#e6f3ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:1.3rem;letter-spacing:-.05em}.brand b,.purple{color:var(--purple)}.status{font-size:.78rem;color:var(--muted);display:flex;gap:7px;align-items:center}.status i{width:8px;height:8px;border-radius:50%;background:#d09a3f}.status.live i{background:#34a66f}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;margin:34px 0 22px}.hero h1{font:700 clamp(2.8rem,8vw,5.9rem)/.92 Georgia,serif;letter-spacing:-.06em;margin:8px 0}.hero p{color:var(--muted);margin:0;font-size:1.02rem}.quick{border:0;background:var(--ink);color:#fff;padding:12px 15px;border-radius:13px;font-weight:850;cursor:pointer}.quick.on{background:var(--purple)}nav{position:sticky;top:10px;z-index:5;display:flex;gap:6px;background:rgba(255,253,248,.88);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:22px}nav button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font-weight:850;color:var(--muted);cursor:pointer}nav .active{background:var(--ink);color:#fff}.view{display:none}.view.active{display:block}.todayDate{font:700 clamp(2.15rem,7vw,4rem)/1 Georgia,serif;letter-spacing:-.045em;margin:8px 0 18px}.super{background:var(--ink);color:white;border-radius:22px;padding:22px;margin-bottom:26px}.super .eyebrow{color:#c8c2ff}.super h2{font:700 1.7rem Georgia,serif;margin:6px 0 10px}.super p{color:#e8e4dc;line-height:1.62;margin:0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:30px 0 12px}.sectionHead h2{font:700 1.8rem Georgia,serif;margin:4px 0 0}.sectionHead span,.issueMeta{color:var(--muted);font-size:.82rem}.rankList{display:grid;gap:9px}.rankStory{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.rankNo{font:700 1.3rem Georgia,serif;color:var(--purple)}.rankStory h3,.archiveStory h3{font:700 1.08rem Georgia,serif;margin:0 0 6px}.rankStory p,.archiveStory p{margin:0;color:var(--muted);line-height:1.48;font-size:.89rem}.readLink{display:inline-flex;margin-top:8px;color:var(--purple);font-weight:850;text-decoration:none;font-size:.8rem}.newsletters,.recapSources{display:grid;grid-template-columns:1fr 1fr;gap:14px}.newsletter,.recapBox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.newsletter h3,.recapBox h3{font:700 1.35rem Georgia,serif;margin:5px 0 12px}.mini{padding:11px 0;border-bottom:1px dashed var(--line)}.mini:last-child{border-bottom:0}.mini strong{font-family:Georgia,serif}.mini p{margin:4px 0 0;color:var(--muted);line-height:1.4;font-size:.86rem}.chip{display:inline-flex;font-size:.68rem;font-weight:850;border-radius:999px;padding:5px 8px;background:#f0ece3;color:#665f55}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 170px 170px 170px;gap:8px;margin-bottom:14px}.filters input,.filters select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font:inherit}.dateWrap{position:relative;min-width:0;width:100%;max-width:100%;overflow:hidden}.dateWrap input{width:100%;max-width:100%;min-width:0;display:block;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font:inherit;color:transparent;text-align:center;text-align-last:center;caret-color:transparent;appearance:none;-webkit-appearance:none}.dateWrap input:focus{outline:2px solid var(--purple);outline-offset:-2px}.dateWrap label{display:none}.dateDisplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:1rem;color:#aaa69f;pointer-events:none;white-space:nowrap}.dateWrap.hasValue .dateDisplay{color:var(--ink)}.issue,.recapMonth{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}.issue>summary,.recapMonth>summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:16px 18px;cursor:pointer}.issue>summary::-webkit-details-marker,.recapMonth>summary::-webkit-details-marker{display:none}.issueBody{padding:0 17px 10px}.archiveStory{padding:14px 0;border-top:1px dashed var(--line)}.knowledge{background:var(--purpleSoft);border-radius:12px;padding:10px 12px;margin-top:8px}.knowledge b{font-size:.76rem}.knowledge p{margin-top:5px}.monthTitle{font:700 1.4rem Georgia,serif}.recapInner{padding:0 20px 20px}.recapHero{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-bottom:15px}.recapHero p{color:#e7e3db;line-height:1.55}.callout{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:16px}.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:34px}@media(max-width:760px){.hero{grid-template-columns:1fr}.quick{justify-self:start}.newsletters,.recapSources{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.rankStory{grid-template-columns:34px 1fr}.rankStory>a{grid-column:2}.dateWrap{grid-column:1/-1;width:100%;max-width:100%;min-width:0}.dateDisplay{justify-content:center;padding:0 12px}.dateWrap.hasValue .dateDisplay{display:flex}.dateWrap:not(.hasValue) .dateDisplay{color:#aaa69f}}@media(max-width:480px){.wrap{padding:15px 12px 72px}.filters{grid-template-columns:1fr}.filters input:first-child{grid-column:auto}.sectionHead{align-items:flex-start;flex-direction:column}.hero{margin-top:26px}.hero h1{font-size:3.25rem}.dateWrap{grid-column:auto;width:100%;max-width:100%;min-width:0}.dateWrap input{width:100%;max-width:100%;min-width:0}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">DIGEST <b>DIGI</b></div><div class="status" id="status"><i></i><span>Loading…</span></div></header><section class="hero"><div><h1>Digi did the reading.</h1><p>Read everything. Retain everything substantive. Connect the dots.</p></div><button class="quick" id="briefButton">⚡ Brief mode</button></section><nav><button class="active" data-tab="today">Today</button><button data-tab="explore">Explore</button><button data-tab="recaps">Recaps</button></nav><section id="today" class="view active"><div id="todayContent"></div></section><section id="explore" class="view"><div class="sectionHead"><div><div class="eyebrow">Master knowledge library</div><h2>Everything Digi knows</h2></div><span id="resultCount"></span></div><div class="filters"><input id="search" placeholder="Search stories, facts, entities…"><select id="source"><option value="all">All newsletters</option></select><select id="topic"><option value="all">All topics</option></select><div class="dateWrap"><input id="date" type="date" aria-label="Choose date"><span id="dateDisplay" class="dateDisplay">Date</span></div></div><div id="results"></div></section><section id="recaps" class="view"><div class="sectionHead"><div><div class="eyebrow">Monthly intelligence</div><h2>Connect the dots</h2></div></div><div id="recapGrid"></div></section><footer>Digest Digi · Your personal corporate intelligence desk.</footer></main><script>
let items=[],briefMode=false,filtersBound=false;const CACHE='digestDigiDataV12',STATE='digestDigiStateV12';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const safeUrl=u=>{try{const x=new URL(String(u||''));return /^https?:$/.test(x.protocol)?x.href:''}catch{return''}};const sourceName=s=>/tldr/i.test(String(s||''))?'TLDR':/futurist/i.test(String(s||''))?'The Futurist':s||'Digest Digi';const daily=()=>items.filter(i=>i.period!=='Monthly Recap');const score=i=>Number(i.importance_score)||(/worth/i.test(i.verdict)?70:40);const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'';const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'});const link=i=>safeUrl(i.article_url)?`<a class="readLink" href="${esc(safeUrl(i.article_url))}" target="_blank" rel="noopener noreferrer">Further reading ↗</a>`:'';const tagHtml=i=>String(i.tags||'').split(',').filter(Boolean).slice(0,4).map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('');
function synth(list,n=6){const r=[...list].sort((a,b)=>score(b)-score(a)).slice(0,n);return r.length?r.map(i=>`${i.title}: ${i.why_it_matters||i.actionable_takeaway||i.summary}`).join(' ').slice(0,1500):'No substantive stories archived yet.'}function rankRows(list,n){return[...list].sort((a,b)=>score(b)-score(a)).slice(0,n).map((i,k)=>`<article class="rankStory"><div class="rankNo">${k+1}</div><div><h3>${esc(i.title)}</h3><p>${esc(i.why_it_matters||i.summary)}</p><div class="chips">${tagHtml(i)}</div></div>${link(i)}</article>`).join('')}function sourceTop(list,name){const x=list.filter(i=>sourceName(i.source)===name).sort((a,b)=>score(b)-score(a)).slice(0,5);return`<section class="newsletter"><div class="eyebrow">${esc(name)} · Top ${x.length}</div><h3>${name==='TLDR'?'Technology & business':'Science & future'}</h3>${x.length?x.map((i,k)=>`<div class="mini"><strong>${k+1}. ${esc(i.title)}</strong><p>${esc(i.why_it_matters||i.summary)}</p>${link(i)}</div>`).join(''):'<div class="empty">No stories from this newsletter yet.</div>'}</section>`}
function renderToday(){const all=[...daily()].sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!all.length){$('todayContent').innerHTML='<div class="empty">No daily intelligence yet.</div>';return}const d=all[0].date,list=all.filter(i=>i.date===d),top=[...list].sort((a,b)=>score(b)-score(a)).slice(0,10);$('todayContent').innerHTML=`<div class="todayDate">${esc(dateLabel(d))}</div><section class="super"><div class="eyebrow">Today in 30 seconds</div><h2>What happened — and what matters</h2><p>${esc(synth(list,8))}</p></section><section><div class="sectionHead"><div><div class="eyebrow">Across all newsletters</div><h2>Top ${top.length} today</h2></div><span>Ranked by significance</span></div><div class="rankList">${rankRows(top,10)}</div></section>${briefMode?'':`<section><div class="sectionHead"><div><div class="eyebrow">By newsletter</div><h2>Your source briefings</h2></div><span>Top five per source</span></div><div class="newsletters">${sourceTop(list,'TLDR')}${sourceTop(list,'The Futurist')}</div></section>`}`}
function story(i){return`<article class="archiveStory"><div class="eyebrow">${esc(sourceName(i.source))}</div><h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p>${i.key_facts?`<div class="knowledge"><b>KEY FACTS</b><p>${esc(i.key_facts)}</p></div>`:''}${i.why_it_matters?`<div class="knowledge"><b>WHY IT MATTERS</b><p>${esc(i.why_it_matters)}</p></div>`:''}${i.actionable_takeaway?`<p class="purple"><b>What to watch:</b> ${esc(i.actionable_takeaway)}</p>`:''}<div class="chips">${tagHtml(i)}</div>${link(i)}</article>`}function setupFilters(){const src=[...new Set(daily().map(i=>sourceName(i.source)).filter(x=>x!=='Digest Digi'))].sort(),ts=[...new Set(daily().flatMap(i=>String(i.tags||'').split(',').map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));const currentSource=$('source').value,currentTopic=$('topic').value;$('source').innerHTML='<option value="all">All newsletters</option>'+src.map(x=>`<option>${esc(x)}</option>`).join('');$('topic').innerHTML='<option value="all">All topics</option>'+ts.map(x=>`<option>${esc(x)}</option>`).join('');if(src.includes(currentSource))$('source').value=currentSource;if(ts.includes(currentTopic))$('topic').value=currentTopic;if(!filtersBound){const st=JSON.parse(localStorage.getItem(STATE)||'{}');$('search').value=st.search||'';$('source').value=st.source||'all';$('topic').value=st.topic||'all';$('date').value=st.date||'';if($('date').value)$('date').closest('.dateWrap').classList.add('hasValue');updateDateDisplay();['search','source','topic','date'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='date')updateDateDisplay();renderExplore()}));filtersBound=true}renderExplore()}
function updateDateDisplay(){const d=$('date').value;if(d){const parts=d.split('-');$('dateDisplay').textContent=parts.length===3?`${parts[1]}-${parts[2]}-${parts[0]}`:d;$('date').closest('.dateWrap').classList.add('hasValue')}else{$('dateDisplay').textContent='Date';$('date').closest('.dateWrap').classList.remove('hasValue')}}
function renderExplore(){const q=$('search').value.trim().toLowerCase(),s=$('source').value,t=$('topic').value,d=$('date').value;updateDateDisplay();localStorage.setItem(STATE,JSON.stringify({search:q,source:s,topic:t,date:d}));const out=[...daily()].sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(i=>(s==='all'||sourceName(i.source)===s)&&(t==='all'||String(i.tags).split(',').map(x=>x.trim()).includes(t))&&(!d||i.date===d)&&(!q||`${i.title} ${i.summary} ${i.tags} ${i.key_facts} ${i.why_it_matters} ${i.entities} ${i.source}`.toLowerCase().includes(q)));$('resultCount').textContent=`${out.length} stories`;const groups={};out.forEach(i=>{const key=i.issue_id||`${i.date}|${sourceName(i.source)}|${i.gmail_message_id||i.period}`;(groups[key]??=[]).push(i)});$('results').innerHTML=Object.values(groups).map((list,k)=>{const i=list[0],title=i.issue_title||`${sourceName(i.source)} · ${dateLabel(i.date)}`;return`<details class="issue" ${k<2?'open':''}><summary><div><strong>${esc(title)}</strong><div class="issueMeta">${esc(sourceName(i.source))} · ${esc(dateLabel(i.date))}</div></div><span>${list.length} ${list.length===1?'story':'stories'} ⌄</span></summary><div class="issueBody">${list.map(story).join('')}</div></details>`}).join('')||'<div class="empty">No matching knowledge yet.</div>'}
function recapBox(name,list){const top=[...list].sort((a,b)=>score(b)-score(a)).slice(0,10);return`<section class="recapBox"><div class="eyebrow">${esc(name)}</div><h3>Monthly briefing</h3><p>${esc(synth(list,6))}</p><details><summary><strong>Top ${top.length} stories</strong></summary><div class="rankList">${rankRows(top,10)}</div></details></section>`}function renderRecaps(){const stories=daily(),rec=items.filter(i=>i.period==='Monthly Recap'),months=[...new Set([...stories,...rec].map(i=>String(i.date).slice(0,7)).filter(Boolean))].sort().reverse();$('recapGrid').innerHTML=months.map((m,k)=>{const ms=stories.filter(i=>String(i.date).startsWith(m)),r=rec.filter(i=>String(i.date).startsWith(m)),overview=r.find(i=>/in (30|60) seconds/i.test(i.title))||r.find(i=>sourceName(i.source)==='Digest Digi'),watch=r.find(i=>/watch|attention next/i.test(i.title)),noise=r.find(i=>/noise/i.test(i.title)),overall=[...ms].sort((a,b)=>score(b)-score(a)).slice(0,15);return`<details class="recapMonth" ${k===0?'open':''}><summary><div><div class="monthTitle">${monthLabel(m)}</div><div class="issueMeta">${ms.length} archived stories · ${r.length} recap sections</div></div><span>⌄</span></summary><div class="recapInner"><section class="recapHero"><div class="eyebrow">${monthLabel(m)} in 60 seconds</div><h2>The bigger picture</h2><p>${esc(overview?.summary||synth(ms,10))}</p></section><div class="sectionHead"><h2>Top ${overall.length} of the month</h2><span>From the actual archive</span></div><div class="rankList">${rankRows(overall,15)}</div><div class="sectionHead"><h2>By newsletter</h2></div><div class="recapSources">${recapBox('TLDR',ms.filter(i=>sourceName(i.source)==='TLDR'))}${recapBox('The Futurist',ms.filter(i=>sourceName(i.source)==='The Futurist'))}</div>${watch?`<section class="callout"><div class="eyebrow">What deserves attention next</div><h3>${esc(watch.title)}</h3><p>${esc(watch.summary)}</p></section>`:''}${noise?`<details class="callout"><summary><strong>Mostly noise</strong></summary><p>${esc(noise.summary)}</p></details>`:''}</div></details>`}).join('')||'<div class="empty">Monthly intelligence will appear here.</div>'}function renderAll(){renderToday();setupFilters();renderRecaps()}function setStatus(live,text){$('status').classList.toggle('live',live);$('status').querySelector('span').textContent=text}function ageText(ts){const m=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/60000));return m<1?'Updated just now':`Updated ${m} min ago`}function setTab(tab,persist=true){if(!['today','explore','recaps'].includes(tab))tab='today';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===tab));if(persist){localStorage.setItem('digestDigiTab',tab);history.replaceState(null,'','#'+tab)}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));window.onhashchange=()=>setTab(location.hash.slice(1)||'today',false);$('briefButton').onclick=()=>{briefMode=!briefMode;$('briefButton').classList.toggle('on',briefMode);$('briefButton').textContent=briefMode?'✓ Brief mode':'⚡ Brief mode';renderToday()};setTab(location.hash.slice(1)||localStorage.getItem('digestDigiTab')||'today',false);
try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c?.items?.length){items=c.items;setStatus(false,ageText(c.saved_at));renderAll()}}catch{}fetch('/api/digests').then(r=>r.json()).then(d=>{if(d.items?.length){items=d.items;localStorage.setItem(CACHE,JSON.stringify({items,saved_at:d.fetched_at||new Date().toISOString()}));renderAll()}setStatus(!!d.live,d.live?ageText(d.fetched_at||new Date()):(d.error?'Connection issue':'Cached data'))}).catch(()=>{if(!items.length){setStatus(false,'Data unavailable');renderAll()}});
</script></body></html>
